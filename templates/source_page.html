<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/theme_variables.css">
    <title>Document</title>
</head>
<body data-theme="{{ theme }}">
    <div class="header_outer_region">
        <div class="inner_header">
            <svg class="menu-icon" onclick="openSidebar()" width="28" height="28" viewBox="0 0 24 24" fill="black"
                xmlns="http://www.w3.org/2000/svg">
                <line x1="3" y1="6" x2="21" y2="6" stroke="{% if theme == 'light' %}black{% else %}white{% endif %}" stroke-width="2"/>
                <line x1="3" y1="12" x2="21" y2="12" stroke="{% if theme == 'light' %}black{% else %}white{% endif %}" stroke-width="2"/>
                <line x1="3" y1="18" x2="21" y2="18" stroke="{% if theme == 'light' %}black{% else %}white{% endif %}" stroke-width="2"/>
            </svg>

            <div id="sidebar" class="sidebar">
                <span class="close-btn" onclick="closeSidebar()">×</span>

                <a href="/library">Library</a>
                <a href="#">Updates</a>
                <a href="/view_manga_history">History</a>
                <a href="/all_extensions">Browse</a>
                <a href="/more_feautures">More</a>
            </div>
            <div class="header_search_group">
                <input class="header_search" type="text" placeholder="Search...">
                <button class="header_button search_button">Search</button>
            </div>
            <button class="header_button add_extension_button"><a href="/addExtension">+ Add Extension</a></button>
        </div>
    </div>


    <div class="outer_region">
        <div class="main_left_side">
            <h1 class="section-title">Menu Bars</h1>
            <div>
                <h1 class="left_heading_bar"><a href="/source">Sources</a></h1>
                <h1 class="left_heading_bar"><a href="/all_extensions">Extension</a></h1>
                <h1 class="left_heading_bar"><a href="#">Migrate</a></h1>
            </div>
        </div>
        {% if manga_data: %}
        <div class="main_right_side">
            <div class="details_side details-offset">
                {% for i in manga_data: %}
                <div class="all_thumb_nails_side">
                        <a href="/all_manga/{{ i[0] }}"><img class="thumb_nails" src="https://pbs.twimg.com/profile_images/1486979031698665473/wgzjZBGJ_400x400.png" alt=""></a>
                        <p class="manga_title"><a href="/all_manga/{{ i[0] }}">{{ i[2] }}</a></p>
                        <div class="manga_meta">
                            <span class="manga_rating">View Manga Names</span>
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
        {% else: %}
        <p>Sorry, No Extension Available</p>
        {% endif %} 
    </div>


    <script>
        function openSidebar() {
        document.getElementById("sidebar").style.left = "0";
        }

        function closeSidebar() {
        document.getElementById("sidebar").style.left = "-21rem";
        }
    </script>
</body>
</html>
