<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/static/auth_styles.css">
</head>

<body>
    <div class="outer_region">
        <div class="inner_header">
            <h1 class="main_heading_header">Simple Project</h1>
            <div style="display: flex; gap: 0.1rem;">
                <a href="/login" style="text-decoration: none;"><h1 class="main_heading_header" style="padding-right: 5rem;">Login</h1></a>
                <a href="/register" style="text-decoration: none;"><h1 class="main_heading_header" style="padding-right: 5rem;">Register</h1></a>
            </div>
        </div>
    </div>

    <div class="outer_region">
        <form action="/register" method="post">
            <div class="inner_register">
                <div>
                    <h1>Please enter Name</h1>
                    <input name="name" type="text" class="register_input_boxes">
                    <h1>Please enter Email</h1>
                    <input name="email" type="email" class="register_input_boxes">
                    <h1>Please enter Password</h1>
                    <input name="password" type="password" class="register_input_boxes">
                </div>
                <div style="height: 2rem;"></div>
                <div>
                    <button class="register_button" type="submit">Save me</button>
                </div>
            </div>
        </form>
        {% if errors: %}
        {% for error in errors %}
        <p class="for_errors">{{ error }}</p>
        {% endfor %}
        {% endif %}

        {% if email_error: %}
        {% for error in email_error %}
        <p class="for_errors">{{ error }}</p>
        {% endfor %}
        {% endif %}
    </div>

</body>

</html>
